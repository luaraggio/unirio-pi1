<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Central de Oportunidades</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="header">
    <div class="logo">
        <img src="../assets/images/logo_unirio_branca.png" alt="Logo UNIRIO">
    </div>

    <div class="title">
        <h1>Central de Oportunidades</h1>
    </div>
</header>

<main class="main">
    <section class="content">
        <div class="container">

            <div class="hero">
                <h2>Acesso do Aluno</h2>
                <p>Informe seus dados para acessar o sistema.</p>
            </div>

            <div class="card">

                <form id="login-form">

                    <label for="email">
                        Email Institucional
                    </label>

                    <input
                        type="email"
                        id="email"
                        required
                    >

                    <small id="email-error"></small>

                    <label for="password">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="password"
                        required
                    >

                    <small id="password-error"></small>

                    <button type="submit">
                        Entrar
                    </button>

                    <p>Não possui conta? <a href="register.html">Cadastre-se</a></p>
                </form>

            </div>
        </div>
    </section>
</main>

<footer class="page-footer">
    <p>Central de Oportunidades UNIRIO</p>
</footer>

<script src="../js/validation.js"></script>
<script src="../js/crypto.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>

</body>
</html>
